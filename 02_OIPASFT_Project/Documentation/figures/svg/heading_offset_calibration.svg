<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img">
<defs>
<marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 12 6 L 0 12 z" fill="#475569"/></marker>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/></filter>
</defs>
<title>Heading Offset Calibration Concept</title>
<rect x="0" y="0" width="1400" height="850" fill="#f8fafc"/>

<text x="60" y="70" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#0f172a" text-anchor="start">Heading Offset Calibration Concept</text>
<text x="60" y="108" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">A known walking segment can align the Android heading frame with the custom room coordinate frame.</text>
<rect x="110" y="185" width="520" height="520" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
<line x1="110.0" y1="185" x2="110.0" y2="705" stroke="#e2e8f0" stroke-width="2"/>
<line x1="110" y1="185.0" x2="630" y2="185.0" stroke="#e2e8f0" stroke-width="2"/>
<line x1="240.0" y1="185" x2="240.0" y2="705" stroke="#e2e8f0" stroke-width="2"/>
<line x1="110" y1="315.0" x2="630" y2="315.0" stroke="#e2e8f0" stroke-width="2"/>
<line x1="370.0" y1="185" x2="370.0" y2="705" stroke="#e2e8f0" stroke-width="2"/>
<line x1="110" y1="445.0" x2="630" y2="445.0" stroke="#e2e8f0" stroke-width="2"/>
<line x1="500.0" y1="185" x2="500.0" y2="705" stroke="#e2e8f0" stroke-width="2"/>
<line x1="110" y1="575.0" x2="630" y2="575.0" stroke="#e2e8f0" stroke-width="2"/>
<line x1="630.0" y1="185" x2="630.0" y2="705" stroke="#e2e8f0" stroke-width="2"/>
<line x1="110" y1="705.0" x2="630" y2="705.0" stroke="#e2e8f0" stroke-width="2"/>
<circle cx="170" cy="285" r="18" fill="#2563eb"/>
<text x="170" y="257" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">A (x1,y1)</text>
<circle cx="540" cy="285" r="18" fill="#10b981"/>
<text x="540" y="257" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">B (x2,y2)</text>
<line x1="195" y1="285" x2="515" y2="285" stroke="#10b981" stroke-width="3" marker-end="url(#arrow)"/>
<text x="355.0" y="330" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#10b981" text-anchor="middle">known room direction</text>
<line x1="110" y1="755" x2="290" y2="755" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<text x="310" y="761" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#334155" text-anchor="start">+x / columns</text>
<line x1="60" y1="185" x2="60" y2="365" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<text x="55" y="395" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#334155" text-anchor="middle">+y / rows</text>
<rect x="760" y="185" width="520" height="175" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
<rect x="760" y="185" width="520" height="10" rx="5" fill="#64748b"/>
<text x="782" y="226" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start">PDR step displacement</text>
<text x="782" y="263" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="start">dx = stepLength * sin(correctedHeading)</text>
<text x="782" y="291" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="start">dy = stepLength * cos(correctedHeading)</text>
<text x="782" y="319" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="start">correctedHeading = rawAndroidHeading +</text>
<text x="782" y="347" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="start">headingOffsetDegrees</text>
<rect x="760" y="420" width="520" height="190" rx="18" fill="#fff7ed" stroke="#f97316" stroke-width="2" filter="url(#shadow)"/>
<rect x="760" y="420" width="520" height="10" rx="5" fill="#f97316"/>
<text x="782" y="462" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start">Offset from a known walking segment</text>
<text x="782" y="499" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="start">roomDirection = atan2(x2 - x1, y2 - y1)</text>
<text x="782" y="527" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="start">headingOffset = roomDirection - averageRawHeading</text>
<text x="782" y="555" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="start">Normalize the angle and circular-average repeated</text>
<text x="782" y="583" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="start">walks.</text>
<rect x="760" y="665" width="520" height="90" rx="16" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
<text x="785" y="700" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#065f46" text-anchor="start">The current 146.0 degree value is treated as an empirical</text>
<text x="785" y="724" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#065f46" text-anchor="start">room-frame alignment parameter, not a universal constant.</text>
</svg>