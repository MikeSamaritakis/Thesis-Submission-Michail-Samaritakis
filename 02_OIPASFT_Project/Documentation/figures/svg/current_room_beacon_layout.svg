<line x1="130" y1="150.0" x2="950" y2="150.0" stroke="#e2e8f0" stroke-width="2"/>
<text x="105" y="155.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="end">row 0</text>
<line x1="130" y1="355.0" x2="950" y2="355.0" stroke="#e2e8f0" stroke-width="2"/>
<text x="105" y="360.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="end">row 1</text>
