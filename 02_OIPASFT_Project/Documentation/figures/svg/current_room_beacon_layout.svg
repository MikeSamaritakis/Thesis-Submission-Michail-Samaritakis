<text x="105" y="565.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="end">row 2</text>
<line x1="130" y1="765.0" x2="950" y2="765.0" stroke="#e2e8f0" stroke-width="2"/>
