<text x="155.0" y="132.0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start">go6G</text>
<text x="155.0" y="156.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">(0,0) = (0.00 m, 0.00 m)</text>
<circle cx="130.0" cy="970.0" r="18" fill="#2563eb" stroke="#ffffff" stroke-width="5"/>
<text x="155.0" y="1005.0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start">yiBb</text>
<text x="155.0" y="1029.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">(0,4) = (0.00 m, 2.50 m)</text>
<circle cx="950.0" cy="970.0" r="18" fill="#2563eb" stroke="#ffffff" stroke-width="5"/>
<text x="925.0" y="1005.0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="end">SamA15</text>
<text x="925.0" y="1029.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="end">(4,4) = (2.50 m, 2.50 m)</text>
<circle cx="540.0" cy="560.0" r="18" fill="#2563eb" stroke="#ffffff" stroke-width="5"/>
<text x="565.0" y="542.0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start">Red10</text>
<text x="565.0" y="566.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">(2,2) = (1.25 m, 1.25 m)</text>
<line x1="130" y1="1040" x2="380" y2="1040" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<text x="400" y="1046" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#334155" text-anchor="start">x / columns</text>
<line x1="60" y1="150" x2="60" y2="400" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<text x="55" y="435" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#334155" text-anchor="middle">y / rows</text>
<circle cx="1030" cy="205" r="15" fill="#2563eb"/>
<text x="1060" y="212" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#334155" text-anchor="start">BLE transmitter</text>
<text x="1010" y="270" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start">All transmitter positions are</text>
<text x="1010" y="292" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start">derived from the grid because</text>
<text x="1010" y="314" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start">current_test.json does not</text>
<text x="1010" y="336" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start">define explicit positionMeters</text>
<text x="1010" y="358" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start">values.</text>
