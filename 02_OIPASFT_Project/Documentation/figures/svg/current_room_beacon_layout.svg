<text x="60" y="108" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#475569" text-anchor="start">Active calibration from current_test.json: 2.50 m x 2.50 m room mapped to a 5x5 grid.</text>
