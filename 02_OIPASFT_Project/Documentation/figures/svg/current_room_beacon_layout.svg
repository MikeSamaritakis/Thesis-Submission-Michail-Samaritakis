<line x1="130" y1="970.0" x2="950" y2="970.0" stroke="#e2e8f0" stroke-width="2"/>
<text x="105" y="975.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="end">row 4</text>
